<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      /* Adding SVG directly for demonstration purposes */
      .calendar-icon {
        width: 24px;
        height: 24px;
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      input {
        padding-left: 40px; /* Adjust padding to leave space for icon */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Age Calculator</h1>
      <form id="age-form">
        <label for="birthdate">Enter your birthdate:</label>
        <div class="input-wrapper">
          <svg
            class="calendar-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="24"
            height="24"
          >
            <path fill="none" d="M0 0h24v24H0z" />
            <path
              d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"
            />
          </svg>
          <input
            type="text"
            id="birthdate"
            placeholder="Select your birthdate"
          />
        </div>
        <button type="submit">Calculate Age</button>
      </form>
      <div id="result"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/2.3.0/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
  </body>
</html>
